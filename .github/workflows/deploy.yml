name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 内容规范检查（只用标准库，无需 pip install）
      #   - verify_latex.py   公式与数学符号规范
      #   - verify_course.py  目录/图片/数据出处/章节结构
      # 未设置 RAW_DIR 时，年报页码校验自动跳过
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify course consistency
        run: |
          python3 scripts/verify_latex.py
          python3 scripts/verify_course.py

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
